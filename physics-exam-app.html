<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ข้อสอบฟิสิกส์ A-Level</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Sukhumvit Set", "Noto Sans Thai", sans-serif;
    background: #f5f6f8;
    color: #1f2937;
    line-height: 1.6;
    min-height: 100vh;
    padding-bottom: 80px;
  }
  .container { max-width: 820px; margin: 0 auto; padding: 16px; }

  /* Header */
  header {
    background: #fff;
    border-bottom: 1px solid #e5e7eb;
    padding: 14px 16px;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  header h1 { font-size: 18px; font-weight: 700; color: #111827; }
  header .sub { font-size: 13px; color: #6b7280; margin-top: 2px; }

  /* Set picker */
  .set-picker {
    display: flex;
    gap: 8px;
    margin: 12px 0;
    flex-wrap: wrap;
  }
  .set-btn {
    padding: 8px 14px;
    background: #fff;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    color: #374151;
  }
  .set-btn.active { background: #2563eb; color: white; border-color: #2563eb; }
  .set-btn.locked { background: #f3f4f6; color: #9ca3af; cursor: not-allowed; border-style: dashed; }
  .set-btn.done { background: #ecfdf5; color: #065f46; border-color: #6ee7b7; }

  /* Subject picker */
  .subject-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
    margin: 24px 0;
  }
  .subject-card {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 28px 18px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
  }
  .subject-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 14px rgba(37,99,235,0.12);
    border-color: #2563eb;
  }
  .subject-card .icon { font-size: 48px; margin-bottom: 8px; }
  .subject-card .s-name { font-size: 18px; font-weight: 700; color: #111827; margin-bottom: 4px; }
  .subject-card .s-desc { font-size: 13px; color: #6b7280; }

  /* Numeric answer input */
  .numeric-wrap {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 14px;
    margin-top: 8px;
  }
  .numeric-wrap .label { font-size: 12px; color: #6b7280; margin-bottom: 6px; font-weight: 600; }
  .numeric-input {
    width: 100%;
    padding: 12px 14px;
    font-size: 20px;
    font-variant-numeric: tabular-nums;
    border: 2px solid #d1d5db;
    border-radius: 8px;
    outline: none;
    text-align: center;
    font-weight: 600;
    color: #111827;
  }
  .numeric-input:focus { border-color: #2563eb; }
  .q-type-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .q-type-tag.mcq { background: #dbeafe; color: #1e40af; }
  .q-type-tag.numeric { background: #fef3c7; color: #92400e; }

  /* Start screen */
  .start-card {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 28px 20px;
    text-align: center;
    margin: 20px 0;
  }
  .start-card h2 {
    margin: 0 0 8px;
    font-size: 20px;
    color: #111827;
  }
  .start-card .desc {
    font-size: 14px;
    color: #6b7280;
    margin-bottom: 20px;
    line-height: 1.7;
  }
  .start-btn {
    background: #16a34a;
    color: white;
    border: none;
    padding: 14px 28px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(22,163,74,0.3);
  }
  .start-btn:hover { background: #15803d; }

  /* Timer */
  .timer-bar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: #1f2937;
    color: #fff;
    padding: 8px 14px;
    border-radius: 8px;
    margin-bottom: 12px;
    font-size: 14px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .timer-bar .t {
    font-variant-numeric: tabular-nums;
    font-size: 16px;
  }

  /* Pending list */
  .pending-card {
    background: #fff8e6;
    border: 1px solid #fde68a;
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 14px;
  }
  .pending-card .label {
    font-size: 13px;
    color: #92400e;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .pending-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .pending-list span {
    background: #fff;
    border: 1px solid #fcd34d;
    color: #92400e;
    padding: 3px 9px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  .pending-list .none { background: #d1fae5; border-color: #6ee7b7; color: #065f46; }

  /* Question card */
  .qcard {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 14px;
  }
  .qheader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .qnum { font-size: 13px; color: #6b7280; font-weight: 600; }
  .qsection { font-size: 11px; background: #eff6ff; color: #1d4ed8; padding: 3px 8px; border-radius: 6px; }
  .qtext { font-size: 15px; color: #111827; margin-bottom: 14px; white-space: pre-wrap; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .opt {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  .opt:hover { background: #f3f4f6; }
  .opt.selected { background: #dbeafe; border-color: #2563eb; color: #1e40af; }
  .opt .num {
    flex-shrink: 0;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: #fff;
    border: 1px solid #d1d5db;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600;
  }
  .opt.selected .num { background: #2563eb; color: white; border-color: #2563eb; }

  /* ---- SVG visual block for TPAT 3 diagrams ---- */
  .qsvg {
    display: flex; justify-content: center; align-items: center;
    background: #fafafa; border: 1px dashed #e5e7eb;
    border-radius: 10px; padding: 10px; margin-bottom: 14px;
    overflow-x: auto;
  }
  .qsvg svg { max-width: 100%; height: auto; }
  /* Option that shows an SVG diagram (columnar) */
  .options.visual { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
  .options.visual .opt {
    flex-direction: column; align-items: center; gap: 6px;
    padding: 10px; background: #f9fafb;
  }
  .options.visual .opt .optsvg { width: 100%; display:flex; justify-content:center; }
  .options.visual .opt .optsvg svg { max-width: 100%; height: auto; }

  .fill-input {
    width: 100%;
    padding: 10px 12px;
    font-size: 16px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    background: #f9fafb;
  }
  .fill-input:focus { outline: none; border-color: #2563eb; background: #fff; }

  /* Nav grid */
  .navgrid {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 14px;
  }
  .navgrid .label { font-size: 12px; color: #6b7280; margin-bottom: 8px; font-weight: 600; }
  .grid {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 5px;
  }
  .grid button {
    aspect-ratio: 1;
    border: 1px solid #d1d5db;
    background: #fff;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    color: #374151;
  }
  .grid button.answered { background: #dcfce7; border-color: #86efac; color: #15803d; }
  .grid button.current { background: #2563eb; color: white; border-color: #2563eb; font-weight: 700; }

  /* Nav buttons */
  .nav-btns {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .nav-btns button {
    flex: 1;
    padding: 12px;
    font-size: 14px;
    background: #fff;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    cursor: pointer;
    color: #374151;
  }
  .nav-btns button:hover { background: #f3f4f6; }
  .nav-btns button:disabled { opacity: 0.4; cursor: not-allowed; }

  .submit-btn {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    background: #16a34a;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  .submit-btn:disabled { background: #9ca3af; cursor: not-allowed; }

  /* Result */
  .result-card {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 14px;
    text-align: center;
  }
  .score-big { font-size: 44px; font-weight: 700; color: #2563eb; margin: 8px 0; }
  .score-text { font-size: 14px; color: #6b7280; }

  .ans-item {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .ans-item.wrong { border-left: 4px solid #ef4444; }
  .ans-item.correct { border-left: 4px solid #16a34a; }
  .ans-item .qh { font-size: 13px; color: #6b7280; margin-bottom: 6px; }
  .ans-item .qt { font-size: 14px; margin-bottom: 8px; }
  .ans-item .yours { font-size: 13px; color: #b91c1c; margin-bottom: 4px; }
  .ans-item .corr { font-size: 13px; color: #15803d; margin-bottom: 6px; }
  .ans-item .exp { font-size: 13px; color: #4b5563; background: #f9fafb; padding: 8px 10px; border-radius: 6px; }

  .restart-btn {
    width: 100%;
    padding: 12px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
    margin-top: 8px;
  }

  /* Floating draw button */
  .draw-fab {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 56px;
    height: 56px;
    background: #2563eb;
    color: white;
    border-radius: 50%;
    border: none;
    box-shadow: 0 4px 12px rgba(37,99,235,0.4);
    cursor: pointer;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }

  /* Drawing pad overlay */
  .draw-pad {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 50vh;
    background: #fff;
    border: 1px solid #d1d5db;
    border-radius: 12px 12px 0 0;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
    z-index: 200;
    display: none;
    flex-direction: column;
    transform: translateY(100%);
    transition: transform 0.3s ease;
    overflow: hidden;
  }
  .draw-pad.open { display: flex; transform: translateY(0); }
  .draw-pad.dragged {
    bottom: auto;
    right: auto;
    transform: none;
    transition: none;
    border-radius: 12px;
    resize: both;
    overflow: hidden;
    min-width: 280px;
    min-height: 220px;
  }
  .drag-handle {
    padding: 6px 10px;
    background: #e5e7eb;
    text-align: center;
    font-size: 12px;
    color: #6b7280;
    border-bottom: 1px solid #d1d5db;
    cursor: move;
    user-select: none;
    touch-action: none;
    letter-spacing: 2px;
    font-weight: 600;
  }
  .drag-handle:active { background: #d1d5db; }
  .draw-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid #e5e7eb;
    background: #f9fafb;
    flex-wrap: wrap;
  }
  .tool-btn {
    padding: 6px 10px;
    background: #fff;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .tool-btn.active { background: #2563eb; color: white; border-color: #2563eb; }
  .color-btn {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 2px solid #fff;
    box-shadow: 0 0 0 1px #d1d5db;
    cursor: pointer;
    padding: 0;
  }
  .color-btn.active { box-shadow: 0 0 0 2px #2563eb; }
  .draw-canvas {
    flex: 1;
    background: #fff;
    touch-action: none;
    cursor: crosshair;
  }
  .close-pad {
    margin-left: auto;
    background: #ef4444;
    color: white;
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <div class="container" style="padding: 0; display:flex; align-items:center; justify-content:space-between; gap:8px;">
    <div>
      <h1 id="header-title">📚 ข้อสอบ A-Level</h1>
      <div class="sub" id="header-sub">เลือกวิชา</div>
    </div>
    <button id="change-subject-btn" style="display:none; background:#fff; border:1px solid #d1d5db; color:#374151; padding:6px 10px; border-radius:6px; font-size:13px; cursor:pointer;">← เปลี่ยนวิชา</button>
  </div>
</header>

<div class="container">
  <div class="set-picker" id="set-picker"></div>
  <div id="app"></div>
</div>

<!-- Floating draw button -->
<button class="draw-fab" id="draw-fab" title="เปิดกระดานวาด">✏️</button>

<!-- Drawing pad -->
<div class="draw-pad" id="draw-pad">
  <div class="drag-handle" id="drag-handle">⋮⋮⋮ ลากเพื่อย้ายกระดาน ⋮⋮⋮</div>
  <div class="draw-toolbar">
    <button class="tool-btn active" data-tool="pen" id="tool-pen">🖊 ปากกา</button>
    <button class="tool-btn" data-tool="eraser" id="tool-eraser">🧽 ยางลบ</button>
    <button class="color-btn active" style="background:#000" data-color="#000000"></button>
    <button class="color-btn" style="background:#dc2626" data-color="#dc2626"></button>
    <button class="color-btn" style="background:#2563eb" data-color="#2563eb"></button>
    <button class="color-btn" style="background:#16a34a" data-color="#16a34a"></button>
    <button class="color-btn" style="background:#f59e0b" data-color="#f59e0b"></button>
    <button class="tool-btn" id="reset-canvas">🔄 รีเซ็ต</button>
    <button class="close-pad" id="close-pad">✕ ปิด</button>
  </div>
  <canvas class="draw-canvas" id="draw-canvas"></canvas>
</div>

<script>
/* ========================================================
   QUESTION DATA — 3 ชุด ชุดละ 30 ข้อ
   structure:
     { sec, topic, q, opts: [...] | "fill", ans, exp }
   ======================================================== */

const PHYSICS_SECTIONS = {
  A: "กลศาสตร์",
  B: "คลื่นกล/แสง",
  C: "ไฟฟ้า/แม่เหล็ก/EM",
  D: "ความร้อน/ของไหล",
  E: "ฟิสิกส์แผนใหม่"
};

const PHYSICS_EXAMS = [
  /* ========== ชุดที่ 1 ========== */
  {
    name: "ชุดที่ 1",
    questions: [
      // --- A: กลศาสตร์ (10 ข้อ) ---
      { sec:"A", topic:"ธรรมชาติฟิสิกส์",
        q:"การวัดมวลของวัตถุได้ค่า 12.34, 12.36, 12.35, 12.37 กรัม ค่าเฉลี่ยและความไม่แน่นอนคือ",
        opts:["12.35 ± 0.01 g","12.35 ± 0.02 g","12.36 ± 0.01 g","12.36 ± 0.02 g","12.34 ± 0.03 g"],
        ans:2, exp:"ค่าเฉลี่ย = (12.34+12.36+12.35+12.37)/4 = 12.355 ≈ 12.36 g, ความไม่แน่นอน = (max-min)/2 = (12.37-12.34)/2 = 0.015 ≈ 0.02"},
      { sec:"A", topic:"การเคลื่อนที่แนวตรง",
        q:"รถยนต์เคลื่อนที่จากหยุดนิ่งด้วยความเร่ง 2 m/s² เป็นเวลา 6 วินาที จากนั้นคงความเร็วต่ออีก 4 วินาที ระยะทางทั้งหมดเป็นกี่เมตร",
        opts:["36","48","60","84","96"],
        ans:4, exp:"ช่วงแรก: s₁=½(2)(36)=36 m, v=12 m/s ช่วงหลัง: s₂=12×4=48 m รวม=84 m"},
      { sec:"A", topic:"การเคลื่อนที่แนวตรง",
        q:"ยิงวัตถุขึ้นในแนวดิ่งด้วยความเร็วต้น 30 m/s วัตถุจะกลับมาถึงพื้นในเวลาเท่าใด (g=10 m/s²)",
        opts:["3 s","4 s","5 s","6 s","7 s"],
        ans:4, exp:"ขึ้น: t = u/g = 30/10 = 3 s ลง: 3 s รวม = 6 s"},
      { sec:"A", topic:"แรงและกฎการเคลื่อนที่",
        q:"กล่อง 4 kg วางบนพื้นลื่น ดึงด้วยแรง 20 N ทำมุม 37° กับแนวราบ ความเร่งของกล่องเป็นกี่ m/s² (cos37°=0.8)",
        opts:["2","3","4","5","6"],
        ans:3, exp:"แรงในแนวราบ = 20×0.8 = 16 N, a = F/m = 16/4 = 4 m/s²"},
      { sec:"A", topic:"สมดุลกล",
        q:"คานสม่ำเสมอยาว 4 m หนัก 100 N รองรับที่ปลายทั้งสอง A และ B แขวนของหนัก 200 N ที่ระยะ 1 m จาก A หาแรงปฏิกิริยาที่ B",
        opts:["50 N","75 N","100 N","125 N","150 N"],
        ans:3, exp:"สมดุลโมเมนต์ที่ A: B×4 = 100×2 + 200×1 = 400 → B = 100 N"},
      { sec:"A", topic:"งานและพลังงาน",
        q:"วัตถุ 0.5 kg ตกอิสระจากที่สูง 5 m ถ้าหยุดทันทีที่พื้น งานที่พื้นทำต่อวัตถุเป็นกี่จูล (g=10)",
        opts:["−5","−12.5","−25","−50","25"],
        ans:3, exp:"พลังงานจลน์ก่อนกระทบ = mgh = 0.5×10×5 = 25 J งานที่พื้นทำ = ΔKE = 0−25 = −25 J"},
      { sec:"A", topic:"โมเมนตัมและการชน",
        q:"วัตถุ A มวล 3 kg ความเร็ว 4 m/s ชนกับ B มวล 1 kg ที่หยุดนิ่ง แล้วติดกัน ความเร็วหลังชนเป็นกี่ m/s",
        opts:["1","2","3","4","5"],
        ans:3, exp:"โมเมนตัมคงที่: 3×4+0 = 4×v → v = 3 m/s"},
      { sec:"A", topic:"การเคลื่อนที่แนวโค้ง",
        q:"วัตถุเคลื่อนที่เป็นวงกลมรัศมี 2 m ด้วยความเร็ว 4 m/s ความเร่งสู่ศูนย์กลางมีค่ากี่ m/s²",
        opts:["2","4","8","12","16"],
        ans:3, exp:"a = v²/r = 16/2 = 8 m/s²"},
      { sec:"A", topic:"SHM",
        q:"วัตถุเคลื่อนที่แบบ SHM มีสมการ x = 0.05 sin(2πt) คาบของการเคลื่อนที่เป็นกี่วินาที",
        opts:["0.5","1","2","π","2π"],
        ans:2, exp:"ω = 2π → T = 2π/ω = 2π/2π = 1 s"},
      { sec:"A", topic:"SHM",
        q:"สปริง k = 100 N/m ติดมวล 1 kg บนพื้นลื่น ดึงให้ยืด 0.1 m แล้วปล่อย ความเร็วสูงสุดเป็นกี่ m/s",
        opts:["0.5","1","2","5","10"],
        ans:2, exp:"v_max = A√(k/m) = 0.1×√100 = 0.1×10 = 1 m/s"},

/* ========== App state ========== */
const SUBJECT_KEY = "exam_app_current_subject";
let currentSubject = null;  // "physics" | "math" | null (= picker)
let STORAGE_KEY = null;
let SECTIONS = null;
let EXAMS = null;
function bindSubject(subj) {
  currentSubject = subj;
  STORAGE_KEY  = SUBJECTS[subj].storageKey;
  SECTIONS     = SUBJECTS[subj].sections;
  EXAMS        = SUBJECTS[subj].exams;
  localStorage.setItem(SUBJECT_KEY, subj);
}
let state = {
  currentSet: 0,
  currentQ: 0,
  answers: {},     // { setIndex: { qIndex: ansNumber 1..5 } }
  submitted: {},   // { setIndex: true/false }
  canvasData: {},  // { setIndex: { qIndex: dataURL } }  per-question drawings
  started: {},     // { setIndex: true } — user pressed เริ่ม
  startTime: {},   // { setIndex: epochMs }
  endTime: {}      // { setIndex: epochMs } when submitted
};
let timerInterval = null;

function resetState() {
  state = {
    currentSet: 0, currentQ: 0,
    answers: {}, submitted: {}, canvasData: {},
    started: {}, startTime: {}, endTime: {}
  };
}
function loadState() {
  resetState();
  if (!currentSubject) return;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      Object.assign(state, s);
      if (typeof state.canvasData !== "object" || state.canvasData === null) {
        state.canvasData = {};
      }
      if (!state.started)   state.started = {};
      if (!state.startTime) state.startTime = {};
      if (!state.endTime)   state.endTime = {};
    }
  } catch (e) { console.warn("load failed", e); }
}
function saveState() {
  if (!currentSubject) return;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) { console.warn("save failed", e); }
}

/* ===== Question helpers (handle mcq + numeric) ===== */
function isAnswered(q, userAns) {
  if (userAns === undefined || userAns === null) return false;
  if (q.type === "numeric") return String(userAns).trim() !== "";
  return typeof userAns === "number" && userAns >= 1;
}
function isQCorrect(q, userAns) {
  if (!isAnswered(q, userAns)) return false;
  if (q.type === "numeric") {
    const n = parseFloat(userAns);
    if (isNaN(n)) return false;
    const tol = (q.tol !== undefined) ? q.tol : 0;
    return Math.abs(n - q.numAns) <= tol;
  }
  return userAns === q.ans;
}
function answeredCountOf(exam, ans) {
  let c = 0;
  exam.questions.forEach((q, i) => { if (isAnswered(q, ans[i])) c++; });
  return c;
}

/* ========== Render ========== */
function isSetLocked(i) {
  // Set i is locked if any previous set hasn't been submitted
  for (let k = 0; k < i; k++) {
    if (!state.submitted[k]) return true;
  }
  return false;
}
function renderSetPicker() {
  const el = document.getElementById("set-picker");
  el.innerHTML = "";
  EXAMS.forEach((ex, i) => {
    const b = document.createElement("button");
    const locked = isSetLocked(i);
    const done = !!state.submitted[i];
    let cls = "set-btn";
    if (i === state.currentSet) cls += " active";
    if (locked) cls += " locked";
    else if (done) cls += " done";
    b.className = cls;
    b.textContent = (locked ? "🔒 " : done ? "✓ " : "") + ex.name;
    if (locked) {
      b.title = "ต้องทำชุดก่อนหน้าให้เสร็จก่อน";
      b.disabled = true;
    } else {
      b.onclick = () => {
        persistCurrentCanvas();
        state.currentSet = i;
        state.currentQ = 0;
        saveState();
        render();
        loadCanvasToContext();
      };
    }
    el.appendChild(b);
  });
}

function getCurrentExam() { return EXAMS[state.currentSet]; }

/* ===== Per-question canvas helpers ===== */
function getCanvasForCurrent() {
  const s = state.canvasData[state.currentSet];
  if (!s) return "";
  return s[state.currentQ] || "";
}
function setCanvasForCurrent(dataURL) {
  if (!state.canvasData[state.currentSet]) state.canvasData[state.currentSet] = {};
  if (dataURL) {
    state.canvasData[state.currentSet][state.currentQ] = dataURL;
  } else {
    delete state.canvasData[state.currentSet][state.currentQ];
  }
}
function loadCanvasToContext() {
  if (!canvas || !ctx) return;
  const rect = canvas.getBoundingClientRect();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const data = getCanvasForCurrent();
  if (data) {
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height);
    img.src = data;
  }
}
function persistCurrentCanvas() {
  if (!canvas || !ctx) return;
  // Only save if canvas has content (avoid overwriting with blank)
  try {
    setCanvasForCurrent(canvas.toDataURL());
  } catch (e) {}
}
function switchQuestion(newIdx) {
  // Save current question's canvas, then switch, then reload for the new question
  persistCurrentCanvas();
  state.currentQ = newIdx;
  saveState();
  render();
  loadCanvasToContext();
}
function getAnswers() {
  if (!state.answers[state.currentSet]) state.answers[state.currentSet] = {};
  return state.answers[state.currentSet];
}
function isSubmitted() { return !!state.submitted[state.currentSet]; }

function renderSubjectPicker() {
  const app = document.getElementById("app");
  app.innerHTML = "";
  document.getElementById("set-picker").innerHTML = "";
  document.getElementById("change-subject-btn").style.display = "none";
  document.getElementById("header-title").textContent = "📚 ข้อสอบ A-Level";
  document.getElementById("header-sub").textContent = "เลือกวิชาเพื่อเริ่มทำข้อสอบ";

  const grid = document.createElement("div");
  grid.className = "subject-grid";
  Object.keys(SUBJECTS).forEach(key => {
    const s = SUBJECTS[key];
    const card = document.createElement("div");
    card.className = "subject-card";
    card.innerHTML =
      `<div class="icon">${s.icon}</div>
       <div class="s-name">${s.name}</div>
       <div class="s-desc">${s.exams.length} ชุด × ${s.exams[0].questions.length} ข้อ</div>`;
    card.onclick = () => selectSubject(key);
    grid.appendChild(card);
  });
  app.appendChild(grid);

  // Stop timer if any
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  // Hide pencil FAB on picker screen
  const fabEl = document.getElementById("draw-fab");
  if (fabEl) fabEl.style.display = "none";
}

function selectSubject(key) {
  bindSubject(key);
  loadState();
  // Safety: bounce to first unlocked set
  if (isSetLocked(state.currentSet)) {
    for (let i = 0; i < EXAMS.length; i++) {
      if (!isSetLocked(i)) { state.currentSet = i; state.currentQ = 0; break; }
    }
  }
  render();
}

function backToSubjectPicker() {
  if (currentSubject) persistCurrentCanvas();
  saveState();
  // Close pad if open
  const padEl = document.getElementById("draw-pad");
  if (padEl) padEl.classList.remove("open");
  currentSubject = null;
  STORAGE_KEY = null; SECTIONS = null; EXAMS = null;
  localStorage.removeItem(SUBJECT_KEY);
  renderSubjectPicker();
}

function render() {
  if (!currentSubject) { renderSubjectPicker(); return; }

  const fabEl = document.getElementById("draw-fab");
  if (fabEl) fabEl.style.display = "";

  const changeBtn = document.getElementById("change-subject-btn");
  changeBtn.style.display = "";
  changeBtn.onclick = backToSubjectPicker;
  document.getElementById("header-title").textContent =
    `${SUBJECTS[currentSubject].icon} ข้อสอบ ${SUBJECTS[currentSubject].name} A-Level`;

  renderSetPicker();
  const exam = getCurrentExam();
  document.getElementById("header-sub").textContent =
    `${exam.name} • ${exam.questions.length} ข้อ`;

  const app = document.getElementById("app");
  app.innerHTML = "";

  // Stop any running timer — re-created below if needed
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

  if (isSubmitted()) {
    renderResult(app);
  } else if (!state.started[state.currentSet]) {
    renderStart(app);
  } else {
    renderQuiz(app);
  }
  saveState();
}

/* ===== Start screen ===== */
function renderStart(app) {
  const exam = getCurrentExam();
  // Count per section
  const counts = {};
  exam.questions.forEach(q => { counts[q.sec] = (counts[q.sec]||0)+1; });
  const breakdown = Object.keys(counts).map(k =>
    `${SECTIONS[k]}: ${counts[k]} ข้อ`
  ).join(" • ");

  const card = document.createElement("div");
  card.className = "start-card";
  const icon = SUBJECTS[currentSubject].icon;
  card.innerHTML =
    `<h2>${icon} ${exam.name}</h2>
     <div class="desc">
       ทั้งหมด ${exam.questions.length} ข้อ<br>
       ${breakdown}<br>
       <br>
       กด "เริ่มทำข้อสอบ" เพื่อเริ่มนับเวลา<br>
       จะไปชุดถัดไปได้เมื่อส่งชุดนี้แล้ว
     </div>`;
  const btn = document.createElement("button");
  btn.className = "start-btn";
  btn.textContent = "▶ เริ่มทำข้อสอบ";
  btn.onclick = () => {
    state.started[state.currentSet] = true;
    state.startTime[state.currentSet] = Date.now();
    state.currentQ = 0;
    saveState();
    render();
  };
  card.appendChild(btn);
  app.appendChild(card);
}

/* ===== Timer helpers ===== */
function formatDuration(ms) {
  const s = Math.max(0, Math.floor(ms/1000));
  const m = Math.floor(s/60);
  const rem = s % 60;
  return String(m).padStart(2,"0") + ":" + String(rem).padStart(2,"0");
}
function getElapsedMs(setIdx) {
  const start = state.startTime[setIdx];
  if (!start) return 0;
  const end = state.endTime[setIdx] || Date.now();
  return end - start;
}

function renderQuiz(app) {
  const exam = getCurrentExam();
  const ans = getAnswers();
  const total = exam.questions.length;
  const answeredCount = answeredCountOf(exam, ans);

  // Timer bar
  const timer = document.createElement("div");
  timer.className = "timer-bar";
  timer.innerHTML = `<span>⏱ กำลังจับเวลา</span><span class="t" id="timer-t">00:00</span>`;
  app.appendChild(timer);
  const tEl = timer.querySelector("#timer-t");
  const tick = () => { tEl.textContent = formatDuration(getElapsedMs(state.currentSet)); };
  tick();
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(tick, 1000);

  // Pending list
  const pending = [];
  for (let i = 0; i < total; i++) if (!isAnswered(exam.questions[i], ans[i])) pending.push(i);

  const pendingCard = document.createElement("div");
  pendingCard.className = "pending-card";
  if (pending.length === 0) {
    pendingCard.innerHTML =
      `<div class="label">✅ ตอบครบแล้ว ${total} ข้อ พร้อมส่ง</div>`;
  } else {
    pendingCard.innerHTML =
      `<div class="label">⏳ ยังไม่ได้ทำ ${pending.length} ข้อ (กดเพื่อข้ามไป)</div>` +
      `<div class="pending-list">${
        pending.map(i => `<span data-i="${i}">ข้อ ${i+1}</span>`).join("")
      }</div>`;
    pendingCard.querySelectorAll("span[data-i]").forEach(s => {
      s.onclick = () => { switchQuestion(+s.dataset.i); };
    });
  }
  app.appendChild(pendingCard);

  // Question card
  const qIdx = state.currentQ;
  const q = exam.questions[qIdx];
  const qType = q.type || "mcq";
  const typeTag = qType === "numeric"
    ? `<span class="q-type-tag numeric">ระบายเลข</span>`
    : `<span class="q-type-tag mcq">ปรนัย</span>`;
  const card = document.createElement("div");
  card.className = "qcard";
  const svgBlock = q.svg ? `<div class="qsvg">${q.svg}</div>` : "";
  card.innerHTML =
    `<div class="qheader">
      <div class="qnum">ข้อที่ ${qIdx+1} / ${total} ${typeTag}</div>
      <div class="qsection">${SECTIONS[q.sec]} • ${q.topic}</div>
    </div>
    <div class="qtext">${q.q}</div>
    ${svgBlock}`;

  if (qType === "numeric") {
    const wrap = document.createElement("div");
    wrap.className = "numeric-wrap";
    wrap.innerHTML = `<div class="label">ตอบเป็นตัวเลข (ใส่เฉพาะตัวเลข/ทศนิยม)</div>`;
    const input = document.createElement("input");
    input.type = "text";
    input.inputMode = "decimal";
    input.className = "numeric-input";
    input.placeholder = "พิมพ์คำตอบ...";
    input.value = ans[qIdx] !== undefined ? String(ans[qIdx]) : "";
    input.oninput = () => {
      const v = input.value.trim();
      if (v === "") { delete ans[qIdx]; }
      else { ans[qIdx] = v; }
      saveState();
    };
    // On blur, re-render so pending counter / nav grid / submit button refresh
    input.onblur = () => { render(); };
    wrap.appendChild(input);
    card.appendChild(wrap);
  } else {
    const optsDiv = document.createElement("div");
    // If any option contains "<svg" treat as visual option grid
    const isVisual = q.opts.some(op => typeof op === "string" && op.indexOf("<svg") !== -1);
    optsDiv.className = "options" + (isVisual ? " visual" : "");
    q.opts.forEach((op, i) => {
      const num = i+1;
      const opt = document.createElement("div");
      opt.className = "opt" + (ans[qIdx] === num ? " selected" : "");
      const isSvgOpt = typeof op === "string" && op.indexOf("<svg") !== -1;
      if (isSvgOpt) {
        opt.innerHTML = `<div class="num">${num}</div><div class="optsvg">${op}</div>`;
      } else {
        opt.innerHTML = `<div class="num">${num}</div><div>${op}</div>`;
      }
      opt.onclick = () => {
        ans[qIdx] = num;
        saveState();
        render();
      };
      optsDiv.appendChild(opt);
    });
    card.appendChild(optsDiv);
  }
  app.appendChild(card);

  // Nav grid
  const ng = document.createElement("div");
  ng.className = "navgrid";
  ng.innerHTML = `<div class="label">ข้ามไปข้อที่ (เขียว=ตอบแล้ว ${answeredCount}/${total})</div>`;
  const grid = document.createElement("div");
  grid.className = "grid";
  for (let i = 0; i < total; i++) {
    const b = document.createElement("button");
    b.textContent = i+1;
    if (isAnswered(exam.questions[i], ans[i])) b.classList.add("answered");
    if (i === qIdx) b.classList.add("current");
    b.onclick = () => { switchQuestion(i); };
    grid.appendChild(b);
  }
  ng.appendChild(grid);
  app.appendChild(ng);

  // Nav buttons
  const navBtns = document.createElement("div");
  navBtns.className = "nav-btns";
  const prev = document.createElement("button");
  prev.textContent = "← ข้อก่อนหน้า";
  prev.disabled = qIdx === 0;
  prev.onclick = () => { switchQuestion(qIdx-1); };
  const next = document.createElement("button");
  next.textContent = "ข้อถัดไป →";
  next.disabled = qIdx === total-1;
  next.onclick = () => { switchQuestion(qIdx+1); };
  navBtns.appendChild(prev);
  navBtns.appendChild(next);
  app.appendChild(navBtns);

  // Submit button
  const submit = document.createElement("button");
  submit.className = "submit-btn";
  submit.textContent = pending.length === 0
    ? `📝 ส่งคำตอบ (ตอบครบ ${total}/${total})`
    : `ตอบให้ครบก่อนส่ง (เหลือ ${pending.length} ข้อ)`;
  submit.disabled = pending.length !== 0;
  submit.onclick = () => {
    if (confirm("ยืนยันการส่งคำตอบ? จะไม่สามารถแก้ไขได้แล้ว")) {
      state.submitted[state.currentSet] = true;
      state.endTime[state.currentSet] = Date.now();
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      saveState();
      window.scrollTo(0,0);
      render();
    }
  };
  app.appendChild(submit);
}

function renderResult(app) {
  const exam = getCurrentExam();
  const ans = getAnswers();
  let score = 0;
  exam.questions.forEach((q,i) => { if (isQCorrect(q, ans[i])) score++; });

  const card = document.createElement("div");
  card.className = "result-card";
  const pct = Math.round(score*100/exam.questions.length);
  const elapsedMs = getElapsedMs(state.currentSet);
  const mins = Math.floor(elapsedMs/60000);
  const secs = Math.floor((elapsedMs%60000)/1000);
  const timeStr = (state.startTime[state.currentSet] && state.endTime[state.currentSet])
    ? `ใช้เวลา ${mins} นาที ${secs} วินาที`
    : "";
  card.innerHTML =
    `<div style="font-size:14px;color:#6b7280">ผลการสอบ ${exam.name}</div>
     <div class="score-big">${score} / ${exam.questions.length}</div>
     <div class="score-text">คิดเป็น ${pct}%</div>
     ${timeStr ? `<div class="score-text" style="margin-top:6px">⏱ ${timeStr}</div>` : ""}`;
  app.appendChild(card);

  // Reset button
  const restart = document.createElement("button");
  restart.className = "restart-btn";
  restart.textContent = "🔄 ทำชุดนี้ใหม่";
  restart.onclick = () => {
    if (confirm("ลบคำตอบและเริ่มทำใหม่?")) {
      delete state.answers[state.currentSet];
      delete state.submitted[state.currentSet];
      delete state.started[state.currentSet];
      delete state.startTime[state.currentSet];
      delete state.endTime[state.currentSet];
      state.currentQ = 0;
      saveState();
      render();
    }
  };
  app.appendChild(restart);

  // Heading
  const h = document.createElement("div");
  h.style.cssText = "margin:18px 0 10px;font-weight:700;color:#111827";
  h.textContent = "เฉลยทุกข้อ";
  app.appendChild(h);

  // Each answer
  exam.questions.forEach((q,i) => {
    const userAns = ans[i];
    const correct = isQCorrect(q, userAns);
    const answered = isAnswered(q, userAns);
    const qType = q.type || "mcq";
    const item = document.createElement("div");
    item.className = "ans-item " + (correct ? "correct" : "wrong");

    let yourLine = "";
    let corrLine = "";
    const hasSvgOpts = q.opts && q.opts.some(op => typeof op === "string" && op.indexOf("<svg") !== -1);
    const optLabel = (idx) => hasSvgOpts ? `ข้อ ${idx}` : `ข้อ ${idx} (${q.opts[idx-1]})`;
    if (qType === "numeric") {
      if (answered) {
        yourLine = `<div class="${correct ? 'corr' : 'yours'}">คุณตอบ: ${userAns} ${correct ? '✓ ถูก' : '✗ ผิด'}</div>`;
      } else {
        yourLine = `<div class="yours">คุณไม่ได้ตอบ</div>`;
      }
      if (!correct) corrLine = `<div class="corr">เฉลย: ${q.numAns}</div>`;
    } else {
      if (answered) {
        yourLine = `<div class="${correct ? 'corr' : 'yours'}">คุณตอบ: ${optLabel(userAns)} ${correct ? '✓ ถูก' : '✗ ผิด'}</div>`;
      } else {
        yourLine = `<div class="yours">คุณไม่ได้ตอบ</div>`;
      }
      if (!correct) corrLine = `<div class="corr">เฉลย: ${optLabel(q.ans)}</div>`;
    }

    const svgBlock2 = q.svg ? `<div class="qsvg">${q.svg}</div>` : "";
    item.innerHTML =
      `<div class="qh">ข้อที่ ${i+1} • ${SECTIONS[q.sec]} — ${q.topic}</div>
       <div class="qt">${q.q}</div>
       ${svgBlock2}
       ${yourLine}
       ${corrLine}
       <div class="exp"><b>วิธีคิด:</b> ${q.exp}</div>`;
    app.appendChild(item);
  });
}

/* ========== Drawing pad ========== */
const pad = document.getElementById("draw-pad");
const fab = document.getElementById("draw-fab");
const closeBtn = document.getElementById("close-pad");
const canvas = document.getElementById("draw-canvas");
const ctx = canvas.getContext("2d");
let drawing = false;
let lastX = 0, lastY = 0;
let tool = "pen";
let color = "#000000";
let lineWidth = 2;

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  // restore current question's drawing
  const data = getCanvasForCurrent();
  if (data) {
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height);
    img.src = data;
  }
}

fab.onclick = () => {
  pad.classList.add("open");
  setTimeout(resizeCanvas, 350);
};
closeBtn.onclick = () => {
  setCanvasForCurrent(canvas.toDataURL());
  saveState();
  pad.classList.remove("open");
};

document.querySelectorAll(".tool-btn[data-tool]").forEach(b => {
  b.onclick = () => {
    tool = b.dataset.tool;
    document.querySelectorAll(".tool-btn[data-tool]").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
  };
});
document.querySelectorAll(".color-btn").forEach(b => {
  b.onclick = () => {
    color = b.dataset.color;
    document.querySelectorAll(".color-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    tool = "pen";
    document.querySelectorAll(".tool-btn[data-tool]").forEach(x => x.classList.remove("active"));
    document.getElementById("tool-pen").classList.add("active");
  };
});
document.getElementById("reset-canvas").onclick = () => {
  // Reset transform first so clearRect uses raw pixels — guarantees full clear
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.restore();
  setCanvasForCurrent("");
  saveState();
};

function getXY(e) {
  const rect = canvas.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return { x: t.clientX - rect.left, y: t.clientY - rect.top };
}

function start(e) {
  e.preventDefault();
  drawing = true;
  const p = getXY(e);
  lastX = p.x; lastY = p.y;
  // For Apple Pencil pressure sensitivity
  if (e.pressure !== undefined && e.pressure > 0) {
    lineWidth = (tool === "eraser" ? 20 : 2) * (0.5 + e.pressure);
  }
}
function move(e) {
  if (!drawing) return;
  e.preventDefault();
  const p = getXY(e);
  ctx.beginPath();
  ctx.moveTo(lastX, lastY);
  ctx.lineTo(p.x, p.y);
  if (tool === "eraser") {
    ctx.globalCompositeOperation = "destination-out";
    ctx.strokeStyle = "rgba(0,0,0,1)";
    ctx.lineWidth = 20;
  } else {
    ctx.globalCompositeOperation = "source-over";
    ctx.strokeStyle = color;
    ctx.lineWidth = lineWidth;
  }
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.stroke();
  lastX = p.x; lastY = p.y;
  if (e.pressure !== undefined && e.pressure > 0) {
    lineWidth = (tool === "eraser" ? 20 : 2) * (0.5 + e.pressure);
  }
}
function end(e) {
  if (drawing) {
    drawing = false;
    setCanvasForCurrent(canvas.toDataURL());
    saveState();
  }
}

// Pointer events for Apple Pencil + touch + mouse
canvas.addEventListener("pointerdown", start);
canvas.addEventListener("pointermove", move);
canvas.addEventListener("pointerup", end);
canvas.addEventListener("pointercancel", end);
canvas.addEventListener("pointerleave", end);

window.addEventListener("resize", () => {
  if (pad.classList.contains("open")) resizeCanvas();
});

/* ========== Draggable pad ========== */
const dragHandle = document.getElementById("drag-handle");
let dragging2 = false;
let dragOffsetX = 0, dragOffsetY = 0;

dragHandle.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  dragging2 = true;
  dragHandle.setPointerCapture(e.pointerId);
  const rect = pad.getBoundingClientRect();
  dragOffsetX = e.clientX - rect.left;
  dragOffsetY = e.clientY - rect.top;

  // Switch pad to free-floating mode (first drag only)
  if (!pad.classList.contains("dragged")) {
    // Persist current strokes before changing canvas size
    try { setCanvasForCurrent(canvas.toDataURL()); saveState(); } catch(_) {}
    pad.style.width = rect.width + "px";
    pad.style.height = rect.height + "px";
    pad.style.left = rect.left + "px";
    pad.style.top = rect.top + "px";
    pad.classList.add("dragged");
    setTimeout(() => { resizeCanvas(); }, 0);
  }
});

dragHandle.addEventListener("pointermove", (e) => {
  if (!dragging2) return;
  e.preventDefault();
  let x = e.clientX - dragOffsetX;
  let y = e.clientY - dragOffsetY;
  x = Math.max(0, Math.min(window.innerWidth - pad.offsetWidth, x));
  y = Math.max(0, Math.min(window.innerHeight - pad.offsetHeight, y));
  pad.style.left = x + "px";
  pad.style.top = y + "px";
});

function endDrag(e) {
  if (dragging2) {
    dragging2 = false;
    try { dragHandle.releasePointerCapture(e.pointerId); } catch(_) {}
  }
}
dragHandle.addEventListener("pointerup", endDrag);
dragHandle.addEventListener("pointercancel", endDrag);

// Re-render canvas after user resizes the pad via CSS resize handle
let padResizeObs = null;
if (window.ResizeObserver) {
  padResizeObs = new ResizeObserver(() => {
    if (pad.classList.contains("open") && pad.classList.contains("dragged")) {
      resizeCanvas();
    }
  });
  padResizeObs.observe(pad);
}

/* ========== Init ========== */
const lastSubject = localStorage.getItem(SUBJECT_KEY);
if (lastSubject && SUBJECTS[lastSubject]) {
  bindSubject(lastSubject);
  loadState();
  if (isSetLocked(state.currentSet)) {
    for (let i = 0; i < EXAMS.length; i++) {
      if (!isSetLocked(i)) { state.currentSet = i; state.currentQ = 0; break; }
    }
  }
  render();
} else {
  renderSubjectPicker();
}
</script>
